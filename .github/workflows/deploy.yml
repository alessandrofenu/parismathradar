# Build the static site (data JSON is regenerated from data/store.json) and publish it to GitHub Pages.
# Enable once in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commits pushed by the "Update data" workflow use GITHUB_TOKEN, which does not trigger `push`
  # workflows, so rebuild explicitly when that workflow finishes.
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate public/data from the committed store
        run: npm run export
      - name: Build
        env:
          VITE_REPO_URL: ${{ format('{0}/{1}', github.server_url, github.repository) }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
