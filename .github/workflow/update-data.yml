# Scheduled ingestion: re-reads every source, updates data/store.json and the generated JSON,
# refreshes the source catalogue, and commits the result. The deploy workflow then rebuilds the site.
name: Update data

on:
  schedule:
    - cron: "17 5,11,17,23 * * *" # four times a day (UTC)
  workflow_dispatch:
    inputs:
      sources:
        description: "Optional: space-separated source ids (e.g. imj-gestion indico-*)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run source adapters + Math World feeds
        env:
          # Identifies the crawler to the sites we read; set a repository variable to override.
          MATHRADAR_CONTACT: ${{ vars.MATHRADAR_CONTACT || format('https://github.com/{0}', github.repository) }}
        run: npm run ingest -- ${{ github.event.inputs.sources && format('--source {0}', github.event.inputs.sources) || '' }}
      - name: Regenerate the source catalogue document
        run: npm run catalogue
      - name: Spot-check events against their official pages
        run: npm run verify -- -n 10 || true
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store.json docs/SOURCE_CATALOGUE.md
          git diff --cached --quiet || git commit -m "data: scheduled ingestion $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
